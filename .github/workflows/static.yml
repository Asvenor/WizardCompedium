# Cloudflare Workers Builds owns deployment. GitHub checks the same source
# without publishing the repository itself as an unbuilt Pages artifact.
name: Validate Wizard Compendium

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "validate-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check types and regression tests
        run: npm run check && npm test
      - name: Build and verify internal links
        run: npm run build && npm run validate:build
      - name: Validate Cloudflare deployment configuration
        run: npx wrangler deploy --dry-run
